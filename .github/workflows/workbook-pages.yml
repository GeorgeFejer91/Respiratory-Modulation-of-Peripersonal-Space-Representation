name: Publish browser workbook

on:
  push:
    branches: [main]
    paths:
      - workbook/**
      - .github/workflows/workbook-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbook-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook tools
        run: python -m pip install -r workbook/requirements.txt uv
      - name: Check data preparation
        run: |
          python -m unittest discover -s workbook -p 'test_*.py' -v
          python for-ai/orchestration/public_data.py check data/raw
          marimo check workbook/data_preparation.py --strict
          marimo check workbook/data_preparation.py --select MW --strict
      - name: Build browser workbook
        run: python workbook/build_site.py --output .for-ai-local/site
      - name: Execute synthetic workbook
        working-directory: workbook
        run: |
          python - <<'PY'
          from data_preparation import app
          outputs, values = app.run()
          assert len(values["trials"]) == 480
          assert len(values["prepared"]) == 376
          assert values["manifest"]["synthetic_demo"] is True
          print(f"Executed workbook successfully: {len(outputs)} outputs")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload workbook only
        uses: actions/upload-pages-artifact@v3
        with:
          path: .for-ai-local/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy workbook
        id: deployment
        uses: actions/deploy-pages@v4
