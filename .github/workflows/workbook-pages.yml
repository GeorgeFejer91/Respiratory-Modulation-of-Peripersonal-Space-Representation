name: Publish browser workbook

on:
  push:
    branches: [main]
    paths:
      - workbook/**
      - data/raw/**
      - results/**
      - manuscript/**
      - literature_review/**
      - analysis/sigmoid_literature_sources.json
      - analysis/questionnaire_literature_sources.json
      - analysis/participant_literature_sources.json
      - .github/workflows/workbook-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbook-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook tools
        run: python -m pip install -r workbook/requirements-validation.txt uv
      - name: Check data preparation
        run: |
          python -m unittest discover -s workbook -p 'test_*.py' -v
          python for-ai/orchestration/public_data.py check data/raw
          marimo check workbook/data_preparation.py --strict
          marimo check workbook/data_preparation.py --select MW --strict
      - name: Build browser workbook
        run: python workbook/build_site.py --output .for-ai-local/site
      - name: Execute published workbook and fixed analysis
        working-directory: workbook
        run: |
          python - <<'PY'
          from data_preparation import app
          from paper_analysis import analyze
          outputs, values = app.run()
          assert len(values["people"]) == 42
          assert len(values["trials"]) == 17114
          assert values["manifest"]["synthetic_demo"] is False
          report, retained = analyze(values["people"], values["trials"])
          assert report["cohort"]["retained_at"] == 8916
          assert all(m["status"] == "computed" for m in report["mixed_models"])
          assert report["sigmoid_summary"][0]["r2_pass_cells"] == 0
          assert report["boundary_followups"]["status"] == "not_estimable"
          assert report["questionnaires"]["scoring"]["matches"] == 328
          assert report["questionnaires"]["scoring"]["mismatches"] == 0
          assert len(report["questionnaires"]["associations"]) == 33
          assert len(report["questionnaires"]["delta_associations"]) == 9
          assert len(report["questionnaires"]["moderation"]) == 16
          assert all(m["status"] == "computed" for m in report["questionnaires"]["moderation"])
          assert report["questionnaires"]["spatial"]["n_pairs"] == 41
          assert report["descriptive_sigmoids"]["candidate_count"] == 320
          assert len(report["descriptive_sigmoids"]["parameters"]) == 4
          assert all(not r["flat_unidentified"] for r in report["descriptive_sigmoids"]["parameters"])
          shape = report["descriptive_sigmoids"]["shape_audit"]
          assert len(shape["visible_candidates"]) == 320 and len(shape["linear_candidates"]) == 160
          assert all(r["visible_transition"] for r in shape["visible_geometry"])
          assert len(shape["nested_prediction"]["outer_folds"]) == 6
          individual = report["participant_sigmoids"]
          assert individual["curve_count"] == 168 and individual["candidate_count"] == 84
          assert len(individual["shared_parameters"]) == 168
          assert len(individual["associations"]) == len(individual["shared_associations"]) == 126
          assert individual["bootstrap_draws"] == 500
          assert len(individual["linkage_sensitivities"]) == 3
          assert individual["linkage_audit"]["groups"][0]["participant_ids"] == ["P011", "P033"]
          print(f"Executed workbook successfully: {len(outputs)} outputs")
          PY
      - name: Independent numerical validation
        run: |
          python workbook/validate_statistics.py
          python workbook/validate_sigmoids.py
          python workbook/validate_questionnaires.py
          python workbook/validate_participant_sigmoids.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload audited publication companion
        uses: actions/upload-pages-artifact@v3
        with:
          path: .for-ai-local/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy workbook
        id: deployment
        uses: actions/deploy-pages@v4
